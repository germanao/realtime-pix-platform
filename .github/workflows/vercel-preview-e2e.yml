name: vercel-preview-e2e

on:
  deployment_status:

permissions:
  contents: read

jobs:
  preview-e2e:
    name: Vercel preview E2E
    if: >-
      github.event.deployment_status.state == 'success' &&
      github.event.deployment.environment == 'Preview – realtime-pix-web'
    runs-on: ubuntu-latest
    environment: poc
    env:
      VERCEL_API_TOKEN: ${{ secrets.VERCEL_API_TOKEN }}
      VERCEL_PROJECT_NAME: realtime-pix-web
      VERCEL_TEAM_SLUG: germanaos-projects
    defaults:
      run:
        working-directory: apps/web
    steps:
      - uses: actions/checkout@v6
      - uses: actions/setup-node@v6
        with:
          node-version: 24
          cache: npm
          cache-dependency-path: apps/web/package-lock.json
      - run: npm ci
      - run: npx playwright install --with-deps chromium
      - name: Create a temporary Vercel automation bypass
        shell: bash
        run: |
          payload='{"generate":{"note":"GitHub Actions preview E2E"}}'
          response="$(curl --fail-with-body --silent --show-error \
            --request PATCH \
            --header "Authorization: Bearer $VERCEL_API_TOKEN" \
            --header "Content-Type: application/json" \
            --data "$payload" \
            "https://api.vercel.com/v1/projects/$VERCEL_PROJECT_NAME/protection-bypass?slug=$VERCEL_TEAM_SLUG")"
          bypass_secret="$(jq -er \
            '[.protectionBypass | to_entries[] | select(.value.note == "GitHub Actions preview E2E")] | max_by(.value.createdAt).key' \
            <<< "$response")"
          echo "::add-mask::$bypass_secret"
          while IFS= read -r stale_secret; do
            echo "::add-mask::$stale_secret"
            stale_payload="$(jq -nc --arg secret "$stale_secret" \
              '{revoke:{secret:$secret,regenerate:false}}')"
            curl --fail-with-body --silent --show-error \
              --request PATCH \
              --header "Authorization: Bearer $VERCEL_API_TOKEN" \
              --header "Content-Type: application/json" \
              --data "$stale_payload" \
              "https://api.vercel.com/v1/projects/$VERCEL_PROJECT_NAME/protection-bypass?slug=$VERCEL_TEAM_SLUG" >/dev/null
          done < <(jq -r --arg current "$bypass_secret" \
            '.protectionBypass | to_entries[] | select(.value.note == "GitHub Actions preview E2E" and .key != $current) | .key' \
            <<< "$response")
          echo "VERCEL_AUTOMATION_BYPASS_SECRET=$bypass_secret" >> "$GITHUB_ENV"
      - name: Run preview E2E
        env:
          PLAYWRIGHT_BASE_URL: ${{ github.event.deployment_status.target_url }}
        run: npm run test:e2e
      - name: Revoke the temporary Vercel automation bypass
        if: always() && env.VERCEL_AUTOMATION_BYPASS_SECRET != ''
        shell: bash
        run: |
          payload="$(jq -nc --arg secret "$VERCEL_AUTOMATION_BYPASS_SECRET" \
            '{revoke:{secret:$secret,regenerate:false}}')"
          curl --fail-with-body --silent --show-error \
            --request PATCH \
            --header "Authorization: Bearer $VERCEL_API_TOKEN" \
            --header "Content-Type: application/json" \
            --data "$payload" \
            "https://api.vercel.com/v1/projects/$VERCEL_PROJECT_NAME/protection-bypass?slug=$VERCEL_TEAM_SLUG" >/dev/null
