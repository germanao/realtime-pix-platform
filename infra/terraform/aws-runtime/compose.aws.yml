name: realtime-pix-aws

x-common: &common
  restart: unless-stopped
  logging:
    driver: json-file
    options: {max-size: "10m", max-file: "3"}
  depends_on:
    postgres: {condition: service_healthy}
  environment: &common-env
    ASPNETCORE_ENVIRONMENT: Production
    ASPNETCORE_URLS: http://0.0.0.0:8080
    ASPNETCORE_HTTP_PORTS: "8080"
    EventBus__Provider: Postgres
    EventBus__ConnectionString: ${BUS_DB_CONNECTION}
    Cors__AllowedOrigins__0: https://realtime-pix-web.vercel.app

services:
  postgres:
    image: postgres:16-alpine
    restart: unless-stopped
    environment:
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD}
      POSTGRES_INITDB_ARGS: --data-checksums
    command: [postgres, -c, shared_buffers=128MB, -c, max_connections=150]
    mem_limit: 768m
    volumes: [./data/postgres:/var/lib/postgresql/data]
    healthcheck:
      test: [CMD-SHELL, "pg_isready -U postgres"]
      interval: 3s
      timeout: 3s
      retries: 30
    logging:
      driver: json-file
      options: {max-size: "10m", max-file: "3"}
  identity-presence:
    <<: *common
    image: ghcr.io/germanao/realtime-pix-identity-presence-service:${RUNTIME_IMAGE_TAG:-aws-latest}
    mem_limit: 384m
    environment:
      <<: *common-env
      ConnectionStrings__Default: ${IDENTITY_DB_CONNECTION}
  bank-a:
    <<: *common
    image: ghcr.io/germanao/realtime-pix-bank-ledger-service:${RUNTIME_IMAGE_TAG:-aws-latest}
    mem_limit: 384m
    environment:
      <<: *common-env
      ConnectionStrings__Default: ${BANK_A_DB_CONNECTION}
      Bank__Id: bank-a
      EventBus__QueueName: bank-a-commands
      Bank__Name: Aurora Bank
      Bank__WelcomeBalance: "10000"
  bank-b:
    <<: *common
    image: ghcr.io/germanao/realtime-pix-bank-ledger-service:${RUNTIME_IMAGE_TAG:-aws-latest}
    mem_limit: 384m
    environment:
      <<: *common-env
      ConnectionStrings__Default: ${BANK_B_DB_CONNECTION}
      Bank__Id: bank-b
      EventBus__QueueName: bank-b-commands
      Bank__Name: Boreal Bank
      Bank__WelcomeBalance: "0"
  transaction:
    <<: *common
    image: ghcr.io/germanao/realtime-pix-transaction-service:${RUNTIME_IMAGE_TAG:-aws-latest}
    mem_limit: 384m
    environment:
      <<: *common-env
      ConnectionStrings__Default: ${TRANSACTION_DB_CONNECTION}
      EventBus__ConsumerName: transaction
      Saga__AllowFailureSimulation: "true"
      Saga__StepTimeoutSeconds: "30"
      Saga__SimulatedCreditTimeoutSeconds: "8"
      Saga__CompensationTimeoutSeconds: "30"
  realtime-events:
    <<: *common
    image: ghcr.io/germanao/realtime-pix-realtime-events-service:${RUNTIME_IMAGE_TAG:-aws-latest}
    mem_limit: 384m
    environment:
      <<: *common-env
      ConnectionStrings__Default: ${REALTIME_DB_CONNECTION}
      EventBus__ConsumerName: realtime-events-v2
  api-gateway:
    <<: *common
    image: ghcr.io/germanao/realtime-pix-api-gateway:${RUNTIME_IMAGE_TAG:-aws-latest}
    mem_limit: 256m
    environment:
      <<: *common-env
      Services__IdentityPresence: http://identity-presence:8080
      Services__BankA: http://bank-a:8080
      Services__BankB: http://bank-b:8080
      Services__Transaction: http://transaction:8080
      Services__RealtimeEvents: http://realtime-events:8080
  bot:
    <<: *common
    image: ghcr.io/germanao/realtime-pix-bot-service:${RUNTIME_IMAGE_TAG:-aws-latest}
    mem_limit: 192m
    environment:
      <<: *common-env
      WalletServiceUrl: http://api-gateway:8080
      Bot__RunOnce: "false"
  edge:
    image: nginx:1.29-alpine
    restart: unless-stopped
    depends_on: [identity-presence, realtime-events, api-gateway]
    ports: ["80:80"]
    volumes: [./nginx.conf:/etc/nginx/nginx.conf:ro]
    mem_limit: 64m
    logging:
      driver: json-file
      options: {max-size: "10m", max-file: "3"}
