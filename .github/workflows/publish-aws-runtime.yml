name: publish-aws-runtime

on:
  workflow_dispatch:
  push:
    branches: [main]
    paths:
      - "services/**"
      - "building-blocks/**"
      - "contracts/**"
      - "Directory.Build.props"
      - "Directory.Packages.props"
      - "global.json"
      - ".github/workflows/publish-aws-runtime.yml"

concurrency:
  group: aws-runtime-images
  cancel-in-progress: false

permissions:
  contents: read
  packages: write

jobs:
  publish:
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        include:
          - repository: api-gateway
            dockerfile: services/api-gateway/Dockerfile
          - repository: identity-presence-service
            dockerfile: services/identity-presence-service/Dockerfile
          - repository: bank-ledger-service
            dockerfile: services/bank-ledger-service/Dockerfile
          - repository: transaction-service
            dockerfile: services/transaction-service/Dockerfile
          - repository: realtime-events-service
            dockerfile: services/realtime-events-service/Dockerfile
          - repository: bot-service
            dockerfile: services/bot-service/Dockerfile
    steps:
      - uses: actions/checkout@v6
      - name: Sign in to GHCR
        env:
          GHCR_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: echo "$GHCR_TOKEN" | docker login ghcr.io --username "${{ github.actor }}" --password-stdin
      - uses: docker/setup-buildx-action@v3
      - uses: docker/build-push-action@v6
        with:
          context: .
          file: ${{ matrix.dockerfile }}
          platforms: linux/amd64
          push: true
          tags: |
            ghcr.io/${{ github.repository_owner }}/realtime-pix-${{ matrix.repository }}:aws-latest
            ghcr.io/${{ github.repository_owner }}/realtime-pix-${{ matrix.repository }}:aws-${{ github.sha }}
