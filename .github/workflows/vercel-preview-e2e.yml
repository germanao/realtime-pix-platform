name: vercel-preview-e2e

on:
  deployment_status:

permissions:
  contents: read

jobs:
  preview-e2e:
    name: Vercel preview E2E
    if: >-
      github.event.deployment_status.state == 'success' &&
      startsWith(github.event.deployment.environment, 'Preview') &&
      startsWith(github.event.deployment_status.target_url, 'https://realtime-pix-') &&
      !startsWith(github.event.deployment_status.target_url, 'https://realtime-pix-platform-')
    runs-on: ubuntu-latest
    environment: poc
    env:
      VERCEL_API_TOKEN: ${{ secrets.VERCEL_API_TOKEN }}
      VERCEL_PROJECT_NAME: realtime-pix-web
      VERCEL_TEAM_SLUG: germanaos-projects
    defaults:
      run:
        working-directory: apps/web
    steps:
      - uses: actions/checkout@v6
      - uses: actions/setup-node@v7
        with:
          node-version: 24
          cache: npm
          cache-dependency-path: apps/web/package-lock.json
      - run: npm ci
      - run: npx playwright install --with-deps chromium
      - name: Load the Vercel automation bypass
        shell: bash
        run: |
          response="$(curl --fail-with-body --silent --show-error \
            --header "Authorization: Bearer $VERCEL_API_TOKEN" \
            "https://api.vercel.com/v9/projects/$VERCEL_PROJECT_NAME?slug=$VERCEL_TEAM_SLUG")"
          bypass_secret="$(jq -er \
            '[.protectionBypass | to_entries[] | select(.value.scope == "automation-bypass" and .value.isEnvVar != false)] | first.key' \
            <<< "$response")"
          echo "::add-mask::$bypass_secret"
          echo "VERCEL_AUTOMATION_BYPASS_SECRET=$bypass_secret" >> "$GITHUB_ENV"
      - name: Run preview E2E
        env:
          PLAYWRIGHT_BASE_URL: ${{ github.event.deployment_status.target_url }}
        run: npm run test:e2e
